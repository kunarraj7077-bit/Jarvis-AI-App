<!DOCTYPE html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
    <style>
        body { background-color: #030914; color: #00f0ff; font-family: 'Courier New', monospace; margin: 0; padding: 15px; overflow-x: hidden; }
        .header-panel { border: 2px solid #00f0ff; background: rgba(10, 25, 47, 0.85); box-shadow: 0 0 15px #00f0ff; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; }
        .hud-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .hud-node { background: rgba(16, 33, 54, 0.5); border-left: 4px solid #ff007f; padding: 10px; border-radius: 4px; font-size: 11px; border-top: 1px solid rgba(0,240,255,0.1); border-bottom: 1px solid rgba(0,240,255,0.1); border-right: 1px solid rgba(0,240,255,0.1); }
        .terminal-viewport { background: #050e1a; border: 1px solid #39ff14; box-shadow: inset 0 0 10px rgba(57,255,20,0.2); border-radius: 6px; height: 320px; overflow-y: auto; padding: 12px; font-size: 12px; margin-bottom: 15px; }
        .log-line { margin-bottom: 8px; line-height: 1.4; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); padding-bottom: 4px; }
        .input-container { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: #091726; border: 1px solid #00f0ff; border-radius: 4px; color: #ffffff; padding: 12px; font-family: inherit; outline: none; }
        button { background: #00f0ff; color: #030914; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; font-family: inherit; box-shadow: 0 0 8px #00f0ff; }
    </style>
</head>
<body>
    <div class="header-panel">⚡ J.A.R.V.I.S. MOBILE SHELL v7.0</div>
    <div class="hud-grid">
        <div class="hud-node" style="border-left-color: #00f0ff;"><b style="color:#00f0ff">RUNTIME:</b> TERMUX NATIVE<br><b style="color:#00f0ff">DEPLOY:</b> APK DISPATCH</div>
        <div class="hud-node" style="border-left-color: #39ff14;"><b style="color:#39ff14;">SECURITY:</b> SECURE<br><b style="color:#39ff14;">DATA CORE:</b> LOCAL DB</div>
    </div>
    <div class="terminal-viewport" id="terminal-viewport">
        <div class="log-line" style="color: #39ff14;">[SYSTEM] Standalone local build initialization parameters verified. Systems standby...</div>
    </div>
    <div class="input-container">
        <input type="text" id="command-field" placeholder="Give target directive (e.g., open camera)...">
        <button onclick="sendDirective()">RUN</button>
    </div>
    <script>
        function sendDirective() {
            var inputElement = document.getElementById('command-field');
            var rawValue = inputElement.value.trim();
            if(!rawValue) return;
            inputElement.value = '';
            appendLogNode("MASTER CONTROLLER", rawValue, "#00f0ff");
            location.href = "jarviscore://" + encodeURIComponent(rawValue);
        }
        function appendLogNode(tag, description, hexColor) {
            var container = document.getElementById('terminal-viewport');
            var wrapper = document.createElement('div');
            wrapper.className = 'log-line';
            wrapper.innerHTML = "<b style='color:" + hexColor + "'>[" + tag + "]</b> " + description;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
